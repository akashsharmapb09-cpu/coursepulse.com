# Git hooks are launched from the app package so the local pnpm-managed
# Lefthook binary is used even though the Git repository root is one level up.
lefthook: cd files && pnpm exec lefthook

pre-commit:
  commands:
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "Gitleaks is required for commits. Install it and add it to PATH." >&2
          exit 1
        fi
        git -c core.autocrlf=false diff --cached --no-ext-diff --no-textconv HEAD | gitleaks stdin --redact --no-banner
