# Git hooks are launched from the app package so the local pnpm-managed
# Lefthook binary is used even though the Git repository root is one level up.
lefthook: cd files && pnpm exec lefthook

pre-commit:
  commands:
    gitleaks:
      # Keep this as a single line: Lefthook 1.13.6 has a Windows bug with
      # multi-line shell commands. Gitleaks must be installed and on PATH.
      run: git -c core.autocrlf=false diff --cached --no-ext-diff --no-textconv HEAD | gitleaks stdin --redact --no-banner
